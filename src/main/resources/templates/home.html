<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SHOPPINGMALL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>

<section class="hero">
    <div class="container">
        <h1>이번 시즌, 당신을 위한 특별한 발견</h1>
        <p>지금 가입하면 첫 구매 10% 할인 쿠폰을 드려요.</p>
        <a href="#featured" class="btn btn-brand">상품 둘러보기</a>
    </div>
</section>

<section class="container my-5">
    <div class="d-flex gap-2 flex-wrap justify-content-center mb-5">
        <span class="category-pill active">전체</span>
        <span class="category-pill">패션</span>
        <span class="category-pill">뷰티</span>
        <span class="category-pill">가전</span>
        <span class="category-pill">리빙</span>
        <span class="category-pill">스포츠</span>
    </div>

    <h2 id="featured" class="mb-4 fw-bold">지금 인기있는 상품</h2>
    <div class="row row-cols-2 row-cols-md-4 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="product-card">
                <img th:src="${product.imageUrl}" class="product-img" alt="상품 이미지">
                <div class="p-3">
                    <div class="text-muted small mb-1" th:text="${product.category}">카테고리</div>
                    <div class="fw-semibold mb-2" th:text="${product.name}">상품명</div>
                    <div class="fw-bold mb-3" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">가격</div>
                    <button type="button" class="btn btn-outline-dark btn-sm w-100">장바구니 담기</button>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="border-top py-4 text-center text-muted small">
    &copy; 2026 SHOPPINGMALL. Portfolio project.
</footer>
</body>
</html>
