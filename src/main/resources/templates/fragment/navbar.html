<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-brand" th:href="@{/}">SHOPPINGMALL</a>

        <input type="search" class="form-control d-none d-md-block mx-4" style="max-width: 420px;" placeholder="상품을 검색해보세요">

        <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/cart}" class="text-dark fs-5" title="장바구니">
                <i class="bi bi-cart3"></i>
            </a>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                <a th:href="@{/mypage}" class="text-dark text-decoration-none">마이페이지</a>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">로그아웃</button>
                </form>
            </div>

            <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-sm btn-outline-secondary">로그인</a>
                <a th:href="@{/signup}" class="btn btn-sm btn-brand">회원가입</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
