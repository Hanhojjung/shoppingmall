<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-brand">
        <h1>SHOPPINGMALL</h1>
        <p>가입하고 나만을 위한 추천 상품과 특가 혜택을 가장 먼저 받아보세요.</p>
        <ul>
            <li>회원 전용 할인 쿠폰</li>
            <li>주문 내역 한눈에 조회</li>
            <li>관심 상품 알림</li>
        </ul>
    </div>

    <div class="auth-form-panel">
        <div class="auth-card">
            <h2>회원가입</h2>
            <p class="subtitle">몇 가지 정보만 입력하면 바로 시작할 수 있어요.</p>

            <form th:action="@{/signup}" th:object="${signUpRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email" th:field="*{email}" placeholder="you@example.com"
                           class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input type="password" th:field="*{password}" placeholder="8자 이상"
                           class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <input type="text" th:field="*{name}"
                           class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label">전화번호</label>
                    <input type="text" th:field="*{phone}" placeholder="010-0000-0000" class="form-control">
                </div>

                <div class="alert alert-danger py-2" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

                <button type="submit" class="btn btn-brand w-100">가입하기</button>
            </form>

            <div class="auth-switch">
                이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
