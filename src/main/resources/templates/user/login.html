<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-brand">
        <h1>SHOPPINGMALL</h1>
        <p>다시 만나서 반가워요. 로그인하고 쇼핑을 이어가세요.</p>
        <ul>
            <li>실시간 주문 현황 확인</li>
            <li>찜한 상품 다시보기</li>
            <li>맞춤 추천 상품</li>
        </ul>
    </div>

    <div class="auth-form-panel">
        <div class="auth-card">
            <h2>로그인</h2>
            <p class="subtitle">이메일과 비밀번호를 입력해주세요.</p>

            <div class="alert alert-danger py-2" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</div>
            <div class="alert alert-info py-2" th:if="${param.logout}">로그아웃 되었습니다.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email" name="username" placeholder="you@example.com" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label">비밀번호</label>
                    <input type="password" name="password" class="form-control">
                </div>

                <button type="submit" class="btn btn-brand w-100">로그인</button>
            </form>

            <div class="auth-switch">
                계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
