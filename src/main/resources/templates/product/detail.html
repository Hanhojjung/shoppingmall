<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name} + ' - SHOPPINGMALL'">상품 상세 - SHOPPINGMALL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>

<section class="container my-5">
    <div class="row g-5">
        <div class="col-md-6">
            <img th:src="${product.imageUrl}" class="detail-img" alt="상품 이미지">
        </div>
        <div class="col-md-6">
            <div class="text-muted mb-2" th:text="${product.category.name}">카테고리</div>
            <h1 class="fw-bold mb-3" th:text="${product.name}">상품명</h1>
            <div class="fs-3 fw-bold mb-4" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">가격</div>

            <p class="text-muted" style="white-space: pre-line;" th:text="${product.description}">상품 설명</p>

            <div class="mb-4">
                <span th:if="${product.status.name() == 'SOLD_OUT'}" class="badge text-bg-secondary">품절</span>
                <span th:if="${product.status.name() == 'ON_SALE'}" class="badge text-bg-success">판매중</span>
                <span class="text-muted small ms-2" th:text="'재고 ' + ${product.stockQuantity} + '개'">재고</span>
            </div>

            <button type="button" class="btn btn-brand btn-lg w-100" th:disabled="${product.status.name() != 'ON_SALE'}">
                장바구니 담기
            </button>
        </div>
    </div>
</section>

<footer class="border-top py-4 text-center text-muted small">
    &copy; 2026 SHOPPINGMALL. Portfolio project.
</footer>
</body>
</html>
