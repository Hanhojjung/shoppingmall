<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>전체 상품 - SHOPPINGMALL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>

<section class="container my-5">
    <h2 class="mb-4 fw-bold">전체 상품</h2>

    <div th:if="${products.empty}" class="text-muted text-center py-5">
        등록된 상품이 없습니다.
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-4">
        <div class="col" th:each="product : ${products.content}">
            <a th:href="@{/products/{id}(id=${product.id})}" class="text-decoration-none text-dark">
                <div class="product-card">
                    <img th:src="${product.imageUrl}" class="product-img" alt="상품 이미지">
                    <div class="p-3">
                        <div class="text-muted small mb-1" th:text="${product.category.name}">카테고리</div>
                        <div class="fw-semibold mb-2" th:text="${product.name}">상품명</div>
                        <div class="fw-bold" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">가격</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="d-flex justify-content-center mt-5">
        <ul class="pagination">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products(page=${products.number - 1})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:href="@{/products(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products(page=${products.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>
</section>

<footer class="border-top py-4 text-center text-muted small">
    &copy; 2026 SHOPPINGMALL. Portfolio project.
</footer>
</body>
</html>
